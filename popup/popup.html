<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AimDay</title>
  <link rel="stylesheet" href="../fonts/fonts.css" />
  <style>
    :root {
      --ink: #1c1915;
      --soft: #5c564c;
      --paper: #f5f1e6;
      --card: #faf7f0;
      --accent: #3b6ea5;
      --line: rgba(28, 25, 21, 0.12);
      --font: "Outfit", system-ui, sans-serif;
      --display: "Fraunces", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 300px;
      font-family: var(--font);
      color: var(--ink);
      background: var(--paper);
      padding: 0.95rem;
    }
    h1 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.3rem;
      letter-spacing: -0.02em;
    }
    .sub {
      margin: 0.2rem 0 0.8rem;
      font-size: 0.78rem;
      color: var(--soft);
    }
    .next-box {
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 14px;
      padding: 0.65rem 0.75rem;
      margin-bottom: 0.7rem;
    }
    .next-box strong {
      display: block;
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--accent);
      margin-bottom: 0.2rem;
    }
    .next-box p {
      margin: 0;
      font-family: var(--display);
      font-size: 0.98rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .actions { display: flex; gap: 0.4rem; }
    button {
      flex: 1;
      font: inherit;
      font-weight: 600;
      font-size: 0.82rem;
      border: none;
      border-radius: 12px;
      padding: 0.55rem 0.7rem;
      cursor: pointer;
      background: var(--accent);
      color: #f7f4ee;
    }
    button.ghost {
      background: transparent;
      color: var(--soft);
      border: 1px solid var(--line);
    }
    .empty { font-size: 0.85rem; color: var(--soft); margin: 0 0 0.65rem; }
  </style>
</head>
<body>
  <h1>AimDay</h1>
  <p class="sub" id="sub">Map your thoughts</p>
  <div class="next-box" id="nextBox" hidden>
    <strong>Current focus</strong>
    <p id="nextText"></p>
  </div>
  <p class="empty" id="empty" hidden>No map yet — open the panel to capture.</p>
  <div class="actions">
    <button type="button" class="ghost" id="openFull">Open map</button>
    <button type="button" id="openPanel">Open panel</button>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
